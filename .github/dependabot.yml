version: 2
updates:
  # Python dependencies from pyproject.toml
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:        # one pull request for all Python updates
        patterns: ["*"]

  # GitHub Actions: keeps the pinned commit SHAs in the workflows up to date
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:            # one pull request for all actions, so codeql init and analyze always match
        patterns: ["*"]
