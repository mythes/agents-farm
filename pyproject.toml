[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-farm"
version = "0.6.2"
description = "TUI dashboard for running Claude Code agents: status, context, model limits"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
keywords = ["claude", "claude-code", "tui", "textual", "agents", "dashboard"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = ["textual>=0.80"]

[project.scripts]
agents-farm = "agents_farm.cli:main"

[project.optional-dependencies]
dev = ["pytest", "bandit", "pip-audit"]

[tool.setuptools]
packages = ["agents_farm"]
